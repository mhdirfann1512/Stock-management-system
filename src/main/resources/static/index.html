<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Manager - Access</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Page Background */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Login Card Container */
        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .shop-icon {
            font-size: 50px;
            color: #764ba2;
            margin-bottom: 20px;
        }

        /* Toggle Buttons (Login/Register) */
        .btn-toggle-group {
            background-color: #f1f3f5;
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 25px;
            display: flex;
        }

        .btn-toggle {
            border: none;
            background: transparent;
            width: 50%;
            border-radius: 50px;
            padding: 8px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .btn-toggle.active {
            background-color: white;
            color: #764ba2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Inputs & Buttons */
        .form-control:focus {
            box-shadow: none;
            border-color: #764ba2;
        }

        .btn-primary-custom {
            background: #764ba2;
            border: none;
            color: white;
        }
        
        .btn-primary-custom:hover {
            background: #5e3b83;
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    
    <div class="shop-icon">
        <i class="fas fa-store"></i>
    </div>
    
    <h3 class="mb-4 fw-bold text-secondary">Stock Manager</h3>

    <div class="btn-toggle-group">
        <button id="tab-login" class="btn-toggle active" onclick="switchTab('login')">Login</button>
        <button id="tab-register" class="btn-toggle" onclick="switchTab('register')">Register</button>
    </div>

    <div id="loginForm">
        <div class="input-group mb-3">
            <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
            <input type="text" id="loginUsername" class="form-control" placeholder="Username">
        </div>
        
        <div class="input-group mb-3">
            <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control" placeholder="Password">
        </div>

        <button onclick="login()" class="btn btn-primary-custom w-100 py-2 fw-bold">
            SIGN IN
        </button>
        
        <p id="loginMessage" class="mt-3 small fw-bold"></p>
    </div>

    <div id="registerForm" style="display:none;">
        <div class="input-group mb-3">
            <span class="input-group-text bg-light"><i class="fas fa-user-plus"></i></span>
            <input type="text" id="regUsername" class="form-control" placeholder="Choose Username">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text bg-light"><i class="fas fa-envelope"></i></span>
            <input type="email" id="regEmail" class="form-control" placeholder="Email Address">
        </div>
        
        <div class="input-group mb-3">
            <span class="input-group-text bg-light"><i class="fas fa-key"></i></span>
            <input type="password" id="regPassword" class="form-control" placeholder="Create Password">
        </div>

        <button onclick="register()" class="btn btn-success w-100 py-2 fw-bold">
            CREATE ACCOUNT
        </button>

        <p id="registerMessage" class="mt-3 small fw-bold text-success"></p>
    </div>

</div>

<script src="script.js"></script>

<script>
    function switchTab(tab) {
        const btnLogin = document.getElementById('tab-login');
        const btnReg = document.getElementById('tab-register');

        if (tab === 'login') {
            btnLogin.classList.add('active');
            btnReg.classList.remove('active');
            if (typeof showLogin === "function") showLogin(); 
        } else {
            btnReg.classList.add('active');
            btnLogin.classList.remove('active');
            if (typeof showRegister === "function") showRegister();
        }
    }
</script>

</body>
</html>
